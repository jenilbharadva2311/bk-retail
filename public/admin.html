<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin – Bhavnaben Khakhrawala</title>
<style>:root{--br:#3b2314;--gd:#e9b44c;--or:#e8501a;--bg:#faf3e6;--card:#fff;--ln:#e6d8bf;--mu:#7a6650}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:#2b1b10}
header{background:var(--br);color:var(--gd);padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}header b{font-size:18px;margin-right:auto}
nav button,.b{border:0;border-radius:20px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:600;background:var(--gd);color:var(--br)}nav button{background:#ffffff1a;color:#f5e8cf}nav button.on{background:var(--gd);color:var(--br)}.b.g{background:#25d366;color:#fff}.b.r{background:#c0392b;color:#fff}.b.o{background:#fff;border:1.5px solid var(--ln);color:var(--br)}
main{max-width:1100px;margin:18px auto;padding:0 14px}.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
input,select,textarea{font:inherit;padding:8px 10px;border:1.5px solid var(--ln);border-radius:10px;width:100%;background:#fff}label{font-size:12px;color:var(--mu);display:block;margin-top:8px}small,.mu{color:var(--mu)}.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:#f1e4c8;font-size:12px;font-weight:600}.tag.new{background:#ffe0b2}.tag.delivered,.tag.approved{background:#c8e6c9}.tag.cancelled,.tag.rejected{background:#ffcdd2}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.st{font:700 28px Georgia,serif;color:var(--br)}table{width:100%;border-collapse:collapse}td{padding:4px 8px;border-bottom:1px solid var(--ln)}
#login{max-width:340px;margin:12vh auto}.sent{font-size:12px;color:#2e7d32}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(p,b)=>{const r=await fetch("/api/admin/"+p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});if(r.status==401){login();throw 0}return r.json()};
let S={},tab="orders",flt="all";
const ST=["new","confirmed","packed","shipped","delivered","cancelled"];
function login(msg=""){$("#app").innerHTML=`<div class="c" id="login"><h2>Admin login</h2><input id="pw" type="password" placeholder="Password" autofocus><p style="color:#c0392b">${msg}</p><button class="b" id="go" style="width:100%">Login</button></div>`;
const f=async()=>{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#pw").value})});r.ok?load():login("Wrong password")};$("#go").onclick=f;$("#pw").onkeydown=e=>e.key=="Enter"&&f()}
async function load(){S=await api("data");shell()}
function shell(){const pend=S.reviews.filter(r=>r.status=="pending").length,nw=S.orders.filter(o=>o.status=="new").length;
$("#app").innerHTML=`<header><b>🥠 Admin</b><nav class="row">${[["orders","Orders"+(nw?" ("+nw+")":"")],["reviews","Reviews"+(pend?" ("+pend+")":"")],["products","Products"],["wholesale","Wholesale"],["stats","Sales"]].map(([k,n])=>`<button data-t="${k}" class="${tab==k?"on":""}">${n}</button>`).join("")}</nav><button class="b o" id="lo">Logout</button></header><main id="m"></main>`;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});$("#lo").onclick=async()=>{await api("logout",{});login()};({orders,reviews,products,wholesale,stats})[tab]()}
const fmt=d=>new Date(d.replace(" ","T")+"Z").toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});
const items=o=>{try{return JSON.parse(o.items).map(it=>`<b>${esc(it.p)}</b>: `+Object.entries(it.fl||{}).map(([f,v])=>`${esc(f)} ${esc(v.s)} ×${v.q}`).join(", ")).join("<br>")}catch{return""}};
const itext=o=>{try{return JSON.parse(o.items).map(it=>it.p+": "+Object.entries(it.fl||{}).map(([f,v])=>`${f} ${v.s} x${v.q}`).join(", ")).join("; ")}catch{return""}};
const MSG={new:o=>`Namaste ${o.name}, aapka order ${o.order_id} hume mil gaya hai.\nItems: ${itext(o)}\nHum jaldi confirm karenge. - Bhavnaben Khakhrawala`,
confirmed:o=>`Namaste ${o.name}, aapka order ${o.order_id} confirm ho gaya hai. Dhanyavaad! - Bhavnaben Khakhrawala`,
packed:o=>`Namaste ${o.name}, aapka order ${o.order_id} pack ho gaya hai aur jaldi dispatch hoga. - Bhavnaben Khakhrawala`,
shipped:o=>`Namaste ${o.name}, aapka order ${o.order_id} dispatch ho gaya hai.\nCourier: ${o.courier||"-"}\nTracking ID: ${o.tracking||"-"}\n- Bhavnaben Khakhrawala`,
delivered:o=>`Namaste ${o.name}, aapka order ${o.order_id} deliver ho gaya hai. Khakhra kaisa laga? Review zaroor dijiye. Dhanyavaad! - Bhavnaben Khakhrawala`,
cancelled:o=>`Namaste ${o.name}, aapka order ${o.order_id} cancel kar diya gaya hai. Koi sawal ho to hume batayein. - Bhavnaben Khakhrawala`};
const wa=(num,txt)=>"https://wa.me/"+String(num).replace(/\D/g,"")+"?text="+encodeURIComponent(txt);
function orders(){const l=S.orders.filter(o=>flt=="all"||o.status==flt);
$("#m").innerHTML=`<div class="row" style="margin-bottom:12px"><select id="f" style="width:auto"><option value="all">All orders (${S.orders.length})</option>${ST.map(s=>`<option ${flt==s?"selected":""} value="${s}">${s} (${S.orders.filter(o=>o.status==s).length})</option>`).join("")}</select><button class="b o" id="csv">Download CSV</button></div>`+(l.map(o=>{const sent=JSON.parse(o.sent||"{}");return `<div class="c" data-id="${o.id}"><div class="row"><b>${esc(o.order_id)}</b><span class="tag ${o.status}">${o.status}</span><small>${fmt(o.created_at)}</small><span class="grow"></span><small>${o.total_packs} pack(s)${o.is_international?" · 🌍 International":""}</small></div>
<p><b>${esc(o.name)}</b> · ${esc(o.mobile)} ${o.email?"· "+esc(o.email):""}<br>${esc(o.address)}, ${esc(o.city)}, ${esc(o.state)} ${esc(o.postal_code)}, ${esc(o.country)}${o.notes?`<br><i>Note: ${esc(o.notes)}</i>`:""}</p><p>${items(o)}</p>
<div class="g3"><div><label>Status</label><select class="s">${ST.map(s=>`<option ${o.status==s?"selected":""}>${s}</option>`).join("")}</select></div><div><label>Courier</label><input class="co" value="${esc(o.courier)}"></div><div><label>Tracking ID</label><input class="tr" value="${esc(o.tracking)}"></div><div><label>Internal note</label><input class="nt" value="${esc(o.admin_note)}"></div></div>
<div class="row" style="margin-top:10px"><button class="b" data-a="save">Save</button><button class="b g" data-a="wa">Send WhatsApp (<span class="cur">${o.status}</span>)</button><label style="margin:0"><input type="checkbox" class="sd" style="width:auto" ${sent[o.status]?"checked":""}> message sent</label><span class="sent">${Object.entries(sent).map(([k,v])=>`✓ ${k}`).join("  ")}</span></div></div>`}).join("")||"<p class='mu'>No orders.</p>");
$("#f").onchange=e=>{flt=e.target.value;orders()};$("#csv").onclick=()=>{const h=["order_id","created_at","status","name","mobile","email","country","state","city","postal_code","address","items","total_packs","courier","tracking"],q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const t=[h.join(",")].concat(S.orders.map(o=>h.map(k=>q(k=="items"?itext(o):o[k])).join(","))).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="orders.csv";a.click()};
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const c=b.closest(".c"),o=S.orders.find(x=>x.id==c.dataset.id),sent=JSON.parse(o.sent||"{}");
o.status=c.querySelector(".s").value;o.courier=c.querySelector(".co").value;o.tracking=c.querySelector(".tr").value;o.admin_note=c.querySelector(".nt").value;
if(c.querySelector(".sd").checked)sent[o.status]=sent[o.status]||new Date().toISOString();else delete sent[o.status];o.sent=JSON.stringify(sent);
if(b.dataset.a=="wa"){window.open(wa(o.mobile,MSG[o.status](o)),"_blank");c.querySelector(".sd").checked=true;sent[o.status]=new Date().toISOString();o.sent=JSON.stringify(sent)}
await api("order",{id:o.id,status:o.status,courier:o.courier,tracking:o.tracking,admin_note:o.admin_note,sent});shell()})}
function reviews(){const l=[...S.reviews].sort((a,b)=>(b.status=="pending")-(a.status=="pending"));$("#m").innerHTML=l.map(r=>`<div class="c" data-id="${r.id}"><div class="row"><b>${esc(r.name)}</b><small>${esc(r.city)}</small><span style="color:#e9a700">${"★".repeat(r.rating)}</span><span class="tag ${r.status}">${r.status}</span><small>${esc(r.product)} · ${fmt(r.created_at)}</small></div><p>${esc(r.comment)}</p><div class="row"><button class="b" data-r="approve">Approve</button><button class="b o" data-r="reject">Reject</button><button class="b r" data-r="delete">Delete</button></div></div>`).join("")||"<p class='mu'>No reviews yet. (Demo reviews on the site are separate.)</p>";
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{if(b.dataset.r=="delete"&&!confirm("Delete this review?"))return;await api("review",{id:b.closest(".c").dataset.id,action:b.dataset.r});load()})}
function wholesale(){$("#m").innerHTML=S.wholesale.map(w=>`<div class="c" data-id="${w.id}"><div class="row"><b>${esc(w.business_name)}</b><span class="tag ${w.status}">${w.status}</span><small>${fmt(w.created_at)}</small></div><p>${esc(w.contact_person)} · ${esc(w.mobile)} · ${esc(w.email)}<br>${esc(w.business_type)} · ${esc(w.expected_quantity)} · ${esc(w.city)}, ${esc(w.country)}<br>Interested: ${esc((JSON.parse(w.products||"[]")).join(", "))}<br><i>${esc(w.message)}</i></p><div class="row"><select class="s" style="width:auto">${["new","contacted","done"].map(s=>`<option ${w.status==s?"selected":""}>${s}</option>`).join("")}</select><input class="n grow" placeholder="Note" value="${esc(w.note)}"><button class="b" data-w="1">Save</button><a class="b g" target="_blank" href="${wa(w.mobile,"Namaste "+w.contact_person+", Bhavnaben Khakhrawala se bol rahe hain. Aapki wholesale enquiry ke baare me.")}">WhatsApp</a></div></div>`).join("")||"<p class='mu'>No enquiries.</p>";
document.querySelectorAll("[data-w]").forEach(b=>b.onclick=async()=>{const c=b.closest(".c");await api("wholesale",{id:c.dataset.id,status:c.querySelector(".s").value,note:c.querySelector(".n").value});load()})}
function stats(){const o=S.orders.filter(x=>x.status!="cancelled"),mo={},fl={};let intl=0;o.forEach(x=>{const k=x.created_at.slice(0,7);mo[k]=mo[k]||{n:0,p:0};mo[k].n++;mo[k].p+=x.total_packs;if(x.is_international)intl++;try{JSON.parse(x.items).forEach(it=>Object.entries(it.fl||{}).forEach(([f,v])=>{const n=it.p+" – "+f;fl[n]=(fl[n]||0)+(+v.q||1)}))}catch{}});
$("#m").innerHTML=`<div class="g3"><div class="c"><small>Total orders</small><div class="st">${o.length}</div></div><div class="c"><small>International</small><div class="st">${intl}</div></div><div class="c"><small>Delivered</small><div class="st">${S.orders.filter(x=>x.status=="delivered").length}</div></div></div><div class="c"><h3>Orders per month</h3><table>${Object.entries(mo).sort().reverse().map(([k,v])=>`<tr><td>${k}</td><td>${v.n} orders</td><td>${v.p} packs</td></tr>`).join("")||"<tr><td>No data</td></tr>"}</table></div><div class="c"><h3>Top flavours (packs)</h3><table>${Object.entries(fl).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")||"<tr><td>No data</td></tr>"}</table></div><p class="mu">Rupee sales will show once prices are added to products (next phase).</p>`}
function products(){$("#m").innerHTML=`<button class="b" id="np" style="margin-bottom:12px">+ Add product</button>`+S.products.map(p=>`<div class="c row"><img src="${esc(p.image)}" width="64" height="64" style="object-fit:cover;border-radius:10px"><div class="grow"><b>${esc(p.name)}</b> ${p.sold_out?'<span class="tag cancelled">Out of stock</span>':""}${p.hidden?'<span class="tag">Hidden</span>':""}<br><small>${esc(p.slug)} · ${JSON.parse(p.sizes).join(", ")}</small></div><button class="b o" data-e="${p.id}">Edit</button></div>`).join("");
$("#np").onclick=()=>edit({});document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(S.products.find(p=>p.id==b.dataset.e)))}
function edit(p){const g=p.groups?JSON.parse(p.groups):{},out=p.out?JSON.parse(p.out):[],fi=p.fimg?JSON.parse(p.fimg):{};
const gt=Object.entries(g).map(([k,a])=>k+": "+a.concat(out.filter(f=>a.includes(f)&&0)).map(f=>f+(out.includes(f)?"*":"")).join(", ")).join("\n");
$("#m").innerHTML=`<div class="c"><h3>${p.id?"Edit":"Add"} product</h3><label>Name</label><input id="n" value="${esc(p.name)}"><label>Slug (short, no spaces, e.g. round-khakhra)</label><input id="sl" value="${esc(p.slug)}"><label>Tagline</label><input id="tg" value="${esc(p.tagline)}"><label>Description</label><textarea id="ds" rows="4">${esc(p.descr)}</textarea><label>Pack sizes (comma separated)</label><input id="sz" value="${esc(p.sizes?JSON.parse(p.sizes).join(", "):"")}">
<label>Main photo</label><div class="row"><img id="pv" src="${esc(p.image||"")}" width="70" height="70" style="object-fit:cover;border-radius:10px"><input type="file" id="fi" accept="image/*" style="width:auto"></div><input type="hidden" id="im" value="${esc(p.image||"")}">
<label>Flavours – one line per group, like  Regular: Masala, Jeera, Methi*   (put * after a flavour that is OUT OF STOCK)</label><textarea id="gr" rows="6">${esc(gt)}</textarea>
<label>Flavour photos – one per line:  Flavour = /img/file.jpg   (upload a photo below to get its link)</label><textarea id="fm" rows="4">${esc(Object.entries(fi).map(([k,v])=>k+" = "+v).join("\n"))}</textarea><div class="row"><input type="file" id="fu" accept="image/*" style="width:auto"><small id="fl"></small></div>
<div class="g3"><div><label>Position (0 = first)</label><input id="ps" type="number" value="${p.pos||0}"></div><div><label><input type="checkbox" id="so" style="width:auto" ${p.sold_out?"checked":""}> Whole product OUT OF STOCK (hides it from site)</label><label><input type="checkbox" id="hd" style="width:auto" ${p.hidden?"checked":""}> Hidden</label></div></div>
<div class="row" style="margin-top:14px"><button class="b" id="sv">Save product</button><button class="b o" id="cx">Cancel</button>${p.id?'<button class="b r" id="dl">Delete</button>':""}</div></div>`;
const up=async(file,cb)=>{const im=new Image();im.onload=async()=>{const c=document.createElement("canvas"),k=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const r=await api("image",{data:c.toDataURL("image/jpeg",.8)});cb(r.url)};im.src=URL.createObjectURL(file)};
$("#fi").onchange=e=>up(e.target.files[0],u=>{$("#im").value=u;$("#pv").src=u});$("#fu").onchange=e=>up(e.target.files[0],u=>{$("#fl").textContent="Link: "+u+"  (copy into the list above)"});
$("#cx").onclick=products;if(p.id)$("#dl").onclick=async()=>{if(confirm("Delete this product permanently?")){await api("product",{id:p.id,delete:1});load()}};
$("#sv").onclick=async()=>{const groups={},o=[];$("#gr").value.split("\n").forEach(l=>{const i=l.indexOf(":");if(i<1)return;const k=l.slice(0,i).trim(),a=l.slice(i+1).split(",").map(x=>x.trim()).filter(Boolean).map(x=>{if(x.endsWith("*")){x=x.slice(0,-1).trim();o.push(x)}return x});groups[k]=a});
const fimg={};$("#fm").value.split("\n").forEach(l=>{const i=l.indexOf("=");if(i>0)fimg[l.slice(0,i).trim()]=l.slice(i+1).trim()});
const r=await api("product",{id:p.id,name:$("#n").value,slug:$("#sl").value,tagline:$("#tg").value,descr:$("#ds").value,sizes:$("#sz").value.split(",").map(x=>x.trim()).filter(Boolean),image:$("#im").value,groups,out:o,fimg,sold_out:$("#so").checked,hidden:$("#hd").checked,pos:+$("#ps").value});if(r.error)alert("Check name and slug");else load()}}
load().catch(e=>{if(e!==0)$("#app").innerHTML=`<div class="c" style="max-width:560px;margin:8vh auto"><h2>Backend not reachable</h2><p>This page could not talk to the server (/api). Common reasons:</p><ol><li>You opened the file from your computer. Open it from your live website address instead: <b>https://your-site.pages.dev/admin.html</b></li><li>The <b>functions</b> folder is missing in your GitHub repo root, so the server part was not deployed.</li><li>Cloudflare needs a re-deploy after adding the D1 binding and variables.</li></ol><p class="mu">Test: open <b>/api/products</b> on your site. It must show product data, not a web page.</p><button class="b" onclick="location.reload()">Try again</button></div>`});
</script></body></html>
